spring.application.name=prototype
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/prototype?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=xxxx
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.main.allow-circular-references=true

##### Log Config #####[Begin]
# Config All every thing in Project. ==>> SEQ : FATAL < ERROR < WARN < INFO < DEBUG < TRACE
logging.level.root=INFO
logging.level.com.example.prototype.controller=DEBUG
logging.level.com.example.prototype.services=DEBUG
##### Log Config #####[End]

#### Redis Config [Begin] #### 
spring.redis.host=localhost
spring.redis.port=6379
#### Redis Config [End] #### 

### connect with LGTM Stack => L - Loki , G - Grafana , T - Tempo , M - Mimir
### Open Endpoint for prometheus pass HTTP
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.observations.http.server.requests.enabled=true
management.metrics.enable.http.server.requests=true

# record all metrics of request  although do not use "@Observed".
management.observations.key-values.application=prototype
management.metrics.enable.all=true
management.metrics.tags.application=${spring.application.name}

#Config of mybatis.
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

