version: '3.8'

services:
  prototype-api:
    build: .
    container_name: prototype-api-backend
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    networks:
      - monitor-network

  redis:
    image: redis:alpine
    container_name: redis-prototype-api-backend
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml  # ดึงไฟล์คอนฟิกจากเครื่องเราเข้าไป
    restart: always
    networks:
      - monitor-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    restart: always
    networks:
      - monitor-network

volumes:
  redis_data:
  
networks:
  monitor-network:
    driver: bridge